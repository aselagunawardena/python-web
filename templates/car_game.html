<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Game</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body { background: #181c2f; }
        .car-game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #carGameCanvas {
            background: #222;
            border: 4px solid #667eea;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
        }
        .car-game-title {
            color: #fff;
            font-size: 2.2rem;
            margin-bottom: 18px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 8px #0008;
        }
        .car-game-controls {
            color: #fff;
            margin-top: 18px;
            font-size: 1.1rem;
            background: rgba(0,0,0,0.2);
            padding: 10px 18px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="car-game-container">
        <div class="car-game-title">🏎️ Car Game</div>
        <canvas id="carGameCanvas" width="480" height="320"></canvas>
        <div class="car-game-controls">
            <b>Controls:</b> Arrow keys to drive, <b>Space</b> for handbrake
        </div>
        <a href="/" style="color:#fff;margin-top:20px;display:inline-block;">← Back to Home</a>
    </div>
    <script>
    // 2D car game with oval racetrack and handbrake
    const canvas = document.getElementById('carGameCanvas');
    const ctx = canvas.getContext('2d');
    const cx = canvas.width/2, cy = canvas.height/2;
    const trackA = 120, trackB = 80, trackW = 40; // oval radii and width
    let car = {
        x: cx, y: cy+trackB-trackW/2-30, w: 32, h: 48,
        speed: 0, angle: -Math.PI/2, drift: 0
    };
    let keys = {}, last = 0;

    function drawTrack() {
        // Grass
        ctx.fillStyle = '#2e7d32';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        // Outer oval
        ctx.save();
        ctx.translate(cx, cy);
        ctx.beginPath();
        ctx.ellipse(0,0,trackA,trackB,0,0,2*Math.PI);
        ctx.fillStyle = '#888';
        ctx.fill();
        // Inner oval
        ctx.beginPath();
        ctx.ellipse(0,0,trackA-trackW,trackB-trackW,0,0,2*Math.PI);
        ctx.fillStyle = '#2e7d32';
        ctx.fill();
        // Lane lines
        ctx.setLineDash([12, 12]);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0,0,trackA-trackW/2,trackB-trackW/2,0,0,2*Math.PI);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
    }
    function drawCar() {
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(-car.w/2, -car.h/2, car.w, car.h);
        ctx.fillStyle = '#333';
        ctx.fillRect(-car.w/4, -car.h/2, car.w/2, car.h/4); // windshield
        ctx.restore();
    }
    function update(dt) {
        // Handbrake/drift
        let handbrake = keys[' '];
        let turnRate = handbrake ? 0.08 : 0.045;
        let accel = handbrake ? 0.08 : 0.16;
        let maxSpeed = handbrake ? 2.2 : 3.5;
        // Controls
        if(keys['ArrowUp']) car.speed += accel;
        if(keys['ArrowDown']) car.speed -= accel*0.7;
        car.speed *= 0.98;
        car.speed = Math.max(-maxSpeed, Math.min(car.speed, maxSpeed));
        if(keys['ArrowLeft']) car.angle -= turnRate * (car.speed/2);
        if(keys['ArrowRight']) car.angle += turnRate * (car.speed/2);
        // Drift effect
        if(handbrake) car.drift = Math.min(1, car.drift+0.08);
        else car.drift = Math.max(0, car.drift-0.1);
        // Move
        let driftAngle = car.angle + car.drift*Math.PI/6*(keys['ArrowLeft']?-1:keys['ArrowRight']?1:0);
        car.x += Math.cos(driftAngle) * car.speed;
        car.y += Math.sin(driftAngle) * car.speed;
        // Stay on track (simple oval math)
        let dx = car.x-cx, dy = car.y-cy;
        let dist = Math.sqrt((dx*dx)/(trackA-trackW/2)**2 + (dy*dy)/(trackB-trackW/2)**2);
        if(dist>1) {
            // push back in
            let angle = Math.atan2(dy,dx);
            car.x = cx + Math.cos(angle)*(trackA-trackW/2)*0.98;
            car.y = cy + Math.sin(angle)*(trackB-trackW/2)*0.98;
            car.speed *= -0.4;
        }
    }
    function loop(ts) {
        let dt = (ts-last)/16.67; last = ts;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        drawTrack();
        update(dt);
        drawCar();
        requestAnimationFrame(loop);
    }
    document.addEventListener('keydown', e => keys[e.key]=true);
    document.addEventListener('keyup', e => keys[e.key]=false);
    requestAnimationFrame(loop);
    </script>
</body>
</html>

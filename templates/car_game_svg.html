<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Game (Server SVG)</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body { background: #181c2f; }
        .car-game-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .car-game-controls { color: #fff; margin-top: 18px; font-size: 1.1rem; background: rgba(0,0,0,0.2); padding: 10px 18px; border-radius: 8px; }
        .svg-frame { background: #222; border: 4px solid #667eea; border-radius: 12px; margin: 0 auto; display: block; }
        .car-game-btns { margin: 18px 0 0 0; display: flex; gap: 12px; justify-content: center; }
        .car-game-btns button { font-size: 1.5rem; padding: 10px 18px; border-radius: 8px; border: none; background: #667eea; color: #fff; cursor: pointer; transition: background 0.2s; }
        .car-game-btns button:active { background: #ffeb3b; color: #222; }
    </style>
</head>
<body>
    <div class="car-game-container">
        <div class="car-game-title">🏎️ Car Game (Server SVG)</div>
        <img id="carGameSVG" class="svg-frame" width="800" height="500" src="/car-game/state" alt="Car Game SVG"/>
        <div class="car-game-btns">
            <button data-key="ArrowLeft">⬅️</button>
            <button data-key="ArrowUp">⬆️</button>
            <button data-key=" " title="Handbrake">⛔</button>
            <button data-key="ArrowDown">⬇️</button>
            <button data-key="ArrowRight">➡️</button>
        </div>
        <div class="car-game-controls">
            <b>Controls:</b> Arrow keys or buttons, <b>⛔</b> for handbrake
        </div>
        <a href="/" style="color:#fff;margin-top:20px;display:inline-block;">← Back to Home</a>
    </div>
    <script>
    const svgImg = document.getElementById('carGameSVG');
    function sendKey(key) {
        fetch('/car-game/state', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key })
        })
        .then(r => r.text())
        .then(svg => { svgImg.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg); });
    }
    document.querySelectorAll('.car-game-btns button').forEach(btn => {
        btn.addEventListener('click', () => sendKey(btn.getAttribute('data-key')));
    });
    document.addEventListener('keydown', e => {
        if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) {
            sendKey(e.key);
        }
    });
    </script>
</body>
</html>

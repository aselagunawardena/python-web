<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Fun</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .graph-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        .graph-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .graph-card h3 {
            margin-top: 0;
            color: #fff;
        }
        .chart-wrapper {
            position: relative;
            width: 600px;
            height: 600px;
            max-width: 100%;
            margin: 0 auto 30px auto;
        }
        .chart-wrapper canvas {
            margin-top: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .controls button:hover {
            background: #764ba2;
        }
        .equation-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .equation-input-group input {
            flex: 1;
            min-width: 250px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        .equation-input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .equation-input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.2);
        }
        .validation-result {
            padding: 12px 14px;
            border-radius: 6px;
            margin-top: 12px;
            font-weight: 500;
            display: none;
        }
        .validation-result.valid {
            display: block;
            background: rgba(76, 175, 80, 0.2);
            color: #81c784;
            border: 1px solid rgba(76, 175, 80, 0.4);
        }
        .validation-result.invalid {
            display: block;
            background: rgba(244, 67, 54, 0.2);
            color: #e57373;
            border: 1px solid rgba(244, 67, 54, 0.4);
        }
        .equation-info {
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #ccc;
            font-size: 13px;
            line-height: 1.5;
            display: none;
        }
        .equation-info.show {
            display: block;
        }
        .coordinates-table {
            margin-top: 140px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow-x: auto;
            clear: both;
        }
        .coordinates-table h4 {
            margin: 0 0 12px 0;
            color: #fff;
            font-size: 14px;
        }
        .coordinates-display {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .coordinate-pair {
            background: rgba(102, 126, 234, 0.15);
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            font-size: 13px;
            color: #ccc;
            white-space: nowrap;
            min-width: fit-content;
        }
        .coordinate-pair strong {
            color: #4facfe;
            margin-right: 2px;
        }
        .coordinate-pair.with-working {
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.6;
        }
        .coordinate-pair .working-steps {
            color: #a0a0a0;
            font-size: 12px;
            margin-top: 4px;
            font-family: 'Courier New', monospace;
        }
        .show-working-control {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .show-working-control input[type="checkbox"] {
            cursor: pointer;
        }
        .show-working-control label {
            color: #ccc;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }
        .axis-range-controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .axis-range-controls .range-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .axis-range-controls label {
            color: #ccc;
            font-size: 13px;
            font-weight: 500;
        }
        .axis-range-controls input[type="number"] {
            width: 70px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
        }
        .axis-range-controls input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .axis-range-controls button {
            padding: 6px 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
        }
        .axis-range-controls button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-content">
            <button class="hamburger" id="hamburgerBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="navbar-logo">✨ quantumlayer</div>
            <div class="navbar-search">
                <input type="text" id="searchInput" placeholder="Search...">
                <button class="search-btn">🔍</button>
            </div>
        </div>
    </nav>

    <!-- Sidebar Menu (hidden by default) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Menu</span>
            <button class="close-btn" id="closeBtn">✕</button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/graph-fun">Graph Fun</a></li>
            <li><a href="/online-shooter">Online Shooter</a></li>
            <li><a href="#" id="settingsLink">Settings</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>

        <div class="settings-panel" id="settingsPanel">
            <h4 style="margin:0 0 10px 0;">Backgrounds</h4>
            <div class="bg-option">
                <input type="radio" name="bg" id="bg-default" value="bg-default">
                <label for="bg-default">Default</label>
                <div class="bg-swatch" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>
            </div>
            <div class="bg-option">
                <input type="radio" name="bg" id="bg-night" value="bg-night">
                <label for="bg-night">Night</label>
                <div class="bg-swatch" style="background: radial-gradient(circle at 10% 20%, #1f2330 0%, #0b1020 60%);"></div>
            </div>
            <div class="bg-option">
                <input type="radio" name="bg" id="bg-forest" value="bg-forest">
                <label for="bg-forest">Forest</label>
                <div class="bg-swatch" style="background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);"></div>
            </div>
            <div class="bg-option">
                <input type="radio" name="bg" id="bg-sunset" value="bg-sunset">
                <label for="bg-sunset">Sunset</label>
                <div class="bg-swatch" style="background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 60%);"></div>
            </div>
            <div class="bg-option">
                <input type="radio" name="bg" id="bg-solid" value="bg-solid">
                <label for="bg-solid">Solid</label>
                <div class="bg-swatch" style="background: #222831;"></div>
            </div>
        </div>
    </aside>

    <!-- Overlay for sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="graph-container">
        <h1>📊 Graph Fun</h1>
        
        <div class="graph-card">
            <h3>📐 Linear Equation Validator</h3>
            <p style="color: #ccc; margin-top: 0; font-size: 13px;">Enter an equation like <code style="background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 3px;">y=2x-1</code> or <code style="background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 3px;">y=x+3</code></p>
            <div class="equation-input-group">
                <input 
                    type="text" 
                    id="equationInput" 
                    placeholder="e.g., y=2x-1 or y=-0.5x+4"
                    onkeypress="if(event.key==='Enter') validateEquation()"
                >
                <button onclick="validateEquation()">Validate & Plot</button>
            </div>
            <div class="validation-result" id="validationResult"></div>
            <div class="equation-info" id="equationInfo"></div>
            <div class="chart-wrapper" id="equationChartWrapper" style="display: none;">
                <div class="axis-range-controls">
                    <div class="range-group">
                        <label>X-axis:</label>
                        <input type="number" id="xMin" value="-10" step="1">
                        <span style="color: #ccc;">to</span>
                        <input type="number" id="xMax" value="10" step="1">
                    </div>
                    <div class="range-group">
                        <label>Y-axis:</label>
                        <input type="number" id="yMin" value="-20" step="1">
                        <span style="color: #ccc;">to</span>
                        <input type="number" id="yMax" value="20" step="1">
                    </div>
                    <button onclick="updateGraphRange()">Update Range</button>
                    <button onclick="resetGraphRange()">Reset</button>
                </div>
                <canvas id="equationChart"></canvas>
            </div>
            <div class="coordinates-table" id="coordinatesTable" style="display: none;">
                <h4>📍 Coordinate Points (10 samples)</h4>
                <div class="show-working-control">
                    <input type="checkbox" id="showWorkingCheckbox" onchange="updateCoordinateDisplay()">
                    <label for="showWorkingCheckbox">Show working (calculations)</label>
                </div>
                <div class="coordinates-display" id="coordinatesDisplay">
                </div>
            </div>
        </div>
    </div>

    <script src="/script.js"></script>
    <script>
        // Global chart references
        let equationChartInstance = null;

        // Helper function to evaluate mathematical expressions with division and multiplication
        function evaluateExpression(expr) {
            if (!expr) return NaN;
            
            try {
                // Handle division: split by / and multiply/divide
                const parts = expr.split('/');
                let result = parseFloat(parts[0]);
                
                if (isNaN(result)) return NaN;
                
                for (let i = 1; i < parts.length; i++) {
                    const divisor = parseFloat(parts[i]);
                    if (isNaN(divisor) || divisor === 0) return NaN;
                    result /= divisor;
                }
                
                return result;
            } catch (e) {
                return NaN;
            }
        }

        // Linear Equation Validator

        function validateEquation() {
            const input = document.getElementById('equationInput').value.trim();
            const resultDiv = document.getElementById('validationResult');
            const infoDiv = document.getElementById('equationInfo');
            const chartWrapper = document.getElementById('equationChartWrapper');

            // Reset messages
            resultDiv.className = 'validation-result';
            infoDiv.className = 'equation-info';
            chartWrapper.style.display = 'none';

            if (!input) {
                resultDiv.textContent = '⚠️ Please enter an equation';
                resultDiv.classList.add('invalid');
                return;
            }

            const result = parseLinearEquation(input);
            
            if (result.valid) {
                resultDiv.textContent = `✅ Valid Linear Equation! (y = ${result.slope}x + ${result.intercept})`;
                resultDiv.classList.add('valid');
                
                infoDiv.classList.add('show');
                infoDiv.innerHTML = `
                    <strong>Equation Details:</strong><br>
                    Slope (m): <strong>${result.slope}</strong><br>
                    Y-intercept (b): <strong>${result.intercept}</strong><br>
                    Form: <strong>y = ${result.slope}x ${result.intercept >= 0 ? '+' : ''} ${result.intercept}</strong>
                `;

                // Plot the equation
                plotEquation(result.slope, result.intercept);
            } else {
                resultDiv.textContent = `❌ ${result.error}`;
                resultDiv.classList.add('invalid');
            }
        }

        function parseLinearEquation(equation) {
            // Remove spaces
            equation = equation.replace(/\s+/g, '');
            
            // Check if it contains 'y='
            if (!equation.includes('y=')) {
                return { valid: false, error: 'Equation must contain "y="' };
            }

            // Split by '='
            const parts = equation.split('=');
            if (parts.length !== 2 || parts[0] !== 'y') {
                return { valid: false, error: 'Left side must be "y"' };
            }

            const rightSide = parts[1];

            // Parse the right side to extract slope and intercept
            // Valid linear forms: mx+b, mx-b, m*x+b, m*x-b, x+b, x-b, mx, x, b
            
            try {
                // Replace * with empty (handle cases like 2*x)
                let expr = rightSide.replace(/\*/g, '');
                
                // Initialize slope and intercept
                let slope = 0;
                let intercept = 0;
                let foundX = false;

                // Check if x exists
                if (expr.includes('x')) {
                    foundX = true;
                    // Split by x
                    const xParts = expr.split('x');
                    const beforeX = xParts[0];
                    const afterX = xParts[1];

                    // Parse slope (before x)
                    if (beforeX === '' || beforeX === '+') {
                        slope = 1;
                    } else if (beforeX === '-') {
                        slope = -1;
                    } else {
                        slope = evaluateExpression(beforeX);
                        if (isNaN(slope)) {
                            return { valid: false, error: 'Invalid coefficient for x (e.g., use 1/2 for fractions)' };
                        }
                    }

                    // Parse intercept (after x)
                    if (afterX === '') {
                        intercept = 0;
                    } else {
                        intercept = evaluateExpression(afterX);
                        if (isNaN(intercept)) {
                            return { valid: false, error: 'Invalid intercept value' };
                        }
                    }
                } else {
                    // No x, must be just a constant (valid linear with slope 0)
                    intercept = evaluateExpression(expr);
                    if (isNaN(intercept)) {
                        return { valid: false, error: 'Invalid constant value' };
                    }
                    slope = 0;
                }

                // Round to reasonable precision
                slope = Math.round(slope * 10000) / 10000;
                intercept = Math.round(intercept * 10000) / 10000;

                return { valid: true, slope, intercept };
            } catch (e) {
                return { valid: false, error: 'Could not parse equation' };
            }
        }

        // Global state for equation
        let currentEquation = { slope: 0, intercept: 0, samplePoints: [] };

        function resetGraphRange() {
            document.getElementById('xMin').value = -10;
            document.getElementById('xMax').value = 10;
            document.getElementById('yMin').value = -20;
            document.getElementById('yMax').value = 20;
            updateGraphRange();
        }

        function updateGraphRange() {
            if (currentEquation.slope !== undefined) {
                plotEquation(currentEquation.slope, currentEquation.intercept);
            }
        }

        function updateCoordinateDisplay() {
            const showWorking = document.getElementById('showWorkingCheckbox').checked;
            const coordinatesDisplay = document.getElementById('coordinatesDisplay');
            const { slope, intercept, samplePoints } = currentEquation;

            if (showWorking) {
                // Show working with calculation steps
                coordinatesDisplay.innerHTML = samplePoints.map(point => {
                    const calculation = slope * point.x + intercept;
                    const slopeStr = slope >= 0 ? slope : `(${slope})`;
                    const interceptStr = intercept >= 0 ? `+ ${intercept}` : `- ${Math.abs(intercept)}`;
                    
                    return `
                        <div class="coordinate-pair with-working">
                            <div><strong>x=${point.x}:</strong></div>
                            <div class="working-steps">y = ${slopeStr}(${point.x}) ${interceptStr}</div>
                            <div class="working-steps">y = ${Math.round(slope * point.x * 100) / 100} ${interceptStr}</div>
                            <div class="working-steps">y = ${point.y}</div>
                        </div>
                    `;
                }).join('');
            } else {
                // Show simple coordinate pairs
                coordinatesDisplay.innerHTML = samplePoints.map(point => `
                    <div class="coordinate-pair">
                        <strong>x:</strong>${point.x} <strong>y:</strong>${point.y}
                    </div>
                `).join('');
            }
        }

        function plotEquation(slope, intercept) {
            const chartWrapper = document.getElementById('equationChartWrapper');
            const coordinatesTable = document.getElementById('coordinatesTable');
            const coordinatesDisplay = document.getElementById('coordinatesDisplay');
            const canvas = document.getElementById('equationChart');

            // Calculate 10 sample coordinates for validation
            const samplePoints = [];
            for (let i = 0; i < 10; i++) {
                const x = -5 + i;
                const y = slope * x + intercept;
                samplePoints.push({
                    x: Math.round(x * 100) / 100,
                    y: Math.round(y * 100) / 100
                });
            }

            // Store current equation data globally
            currentEquation = { slope, intercept, samplePoints };

            // Populate coordinates display
            updateCoordinateDisplay();

            // Get custom axis ranges
            const xMin = parseFloat(document.getElementById('xMin').value) || -10;
            const xMax = parseFloat(document.getElementById('xMax').value) || 10;
            const yMin = parseFloat(document.getElementById('yMin').value) || -20;
            const yMax = parseFloat(document.getElementById('yMax').value) || 20;

            // Calculate points for the line chart (use small step for smooth line)
            const points = [];
            const dataStep = (xMax - xMin) / 100; // More points for smoother line
            
            for (let x = xMin; x <= xMax; x += dataStep) {
                const y = slope * x + intercept;
                points.push({ x: x, y: y });
            }

            if (equationChartInstance) {
                equationChartInstance.destroy();
            }

            const ctx = canvas.getContext('2d');
            
            // Custom plugin to draw axes
            const axesPlugin = {
                id: 'axesPlugin',
                afterDatasetsDraw(chart) {
                    const ctx = chart.ctx;
                    const xScale = chart.scales.x;
                    const yScale = chart.scales.y;
                    const chartArea = chart.chartArea;
                    
                    // Get pixel positions for x=0 and y=0 using linear scale
                    const x0Pixel = xScale.getPixelForValue(0);
                    const y0Pixel = yScale.getPixelForValue(0);
                    
                    // Draw y-axis (vertical line at x = 0) if 0 is in range
                    if (x0Pixel >= chartArea.left && x0Pixel <= chartArea.right) {
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(x0Pixel, chartArea.top);
                        ctx.lineTo(x0Pixel, chartArea.bottom);
                        ctx.stroke();
                    }
                    
                    // Draw x-axis (horizontal line at y = 0) if 0 is in range
                    if (y0Pixel >= chartArea.top && y0Pixel <= chartArea.bottom) {
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(chartArea.left, y0Pixel);
                        ctx.lineTo(chartArea.right, y0Pixel);
                        ctx.stroke();
                    }
                    
                    // Mark the origin (if both axes are visible)
                    if (x0Pixel >= chartArea.left && x0Pixel <= chartArea.right &&
                        y0Pixel >= chartArea.top && y0Pixel <= chartArea.bottom) {
                        ctx.fillStyle = '#ffd600';
                        ctx.beginPath();
                        ctx.arc(x0Pixel, y0Pixel, 4, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                }
            };
            
            equationChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: `y = ${slope}x ${intercept >= 0 ? '+' : ''} ${intercept}`,
                        data: points,
                        borderColor: '#4facfe',
                        backgroundColor: 'rgba(79, 172, 254, 0.1)',
                        borderWidth: 3,
                        tension: 0,
                        fill: true,
                        pointBackgroundColor: '#00f2fe',
                        pointBorderColor: '#4facfe',
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: '#ffd600'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: 1,
                    plugins: {
                        legend: {
                            labels: { color: '#fff' }
                        },
                        axesPlugin: {}
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            min: yMin,
                            max: yMax,
                            ticks: { 
                                color: '#fff',
                                stepSize: 1
                            },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            type: 'linear',
                            min: xMin,
                            max: xMax,
                            ticks: { 
                                color: '#fff',
                                stepSize: 1,
                                maxTicksLimit: 20
                            },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    }
                },
                plugins: [axesPlugin]
            });

            chartWrapper.style.display = 'block';
            coordinatesTable.style.display = 'block';
        }

        // Initialize charts on page load
        window.addEventListener('DOMContentLoaded', () => {
            // Equation validator is ready
        });
    </script>
</body>

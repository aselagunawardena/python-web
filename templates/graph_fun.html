<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Fun</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .graph-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        .graph-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .graph-card h3 {
            margin-top: 0;
            color: #fff;
        }
        .chart-wrapper {
            position: relative;
            width: 600px;
            height: 600px;
            max-width: 100%;
            margin: 0 auto 30px auto;
        }
        .chart-wrapper canvas {
            margin-top: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .controls button:hover {
            background: #764ba2;
        }
        .equation-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .equation-input-group input {
            flex: 1;
            min-width: 250px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        .equation-input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .equation-input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.2);
        }
        .validation-result {
            padding: 12px 14px;
            border-radius: 6px;
            margin-top: 12px;
            font-weight: 500;
            display: none;
        }
        .validation-result.valid {
            display: block;
            background: rgba(76, 175, 80, 0.2);
            color: #81c784;
            border: 1px solid rgba(76, 175, 80, 0.4);
        }
        .validation-result.invalid {
            display: block;
            background: rgba(244, 67, 54, 0.2);
            color: #e57373;
            border: 1px solid rgba(244, 67, 54, 0.4);
        }
        .equation-info {
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #ccc;
            font-size: 13px;
            line-height: 1.5;
            display: none;
        }
        .equation-info.show {
            display: block;
        }
        .coordinates-table {
            margin-top: 140px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow-x: auto;
            clear: both;
        }
        .coordinates-table h4 {
            margin: 0 0 12px 0;
            color: #fff;
            font-size: 14px;
        }
        .coordinates-display {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .coordinate-pair {
            background: rgba(102, 126, 234, 0.15);
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            font-size: 13px;
            color: #ccc;
            white-space: nowrap;
            min-width: fit-content;
        }
        .coordinate-pair strong {
            color: #4facfe;
            margin-right: 2px;
        }
        .coordinate-pair.with-working {
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.6;
        }
        .coordinate-pair .working-steps {
            color: #a0a0a0;
            font-size: 12px;
            margin-top: 4px;
            font-family: 'Courier New', monospace;
        }
        .show-working-control {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .show-working-control input[type="checkbox"] {
            cursor: pointer;
        }
        .show-working-control label {
            color: #ccc;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }
        .axis-range-controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .axis-range-controls .range-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .axis-range-controls label {
            color: #ccc;
            font-size: 13px;
            font-weight: 500;
        }
        .axis-range-controls input[type="number"] {
            width: 70px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
        }
        .axis-range-controls input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .axis-range-controls button {
            padding: 6px 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
        }
        .axis-range-controls button:hover {
            background: #764ba2;
        }
        
        /* Responsive Design */
        @media screen and (max-width: 768px) {
            .graph-container {
                padding: 15px;
            }
            
            .chart-wrapper {
                width: 100%;
                height: auto;
                aspect-ratio: 1;
            }
            
            .equation-input-group {
                flex-direction: column;
            }
            
            .equation-input-group input {
                min-width: 100%;
            }
            
            .equation-input-group button {
                width: 100%;
            }
            
            .axis-range-controls {
                gap: 10px;
            }
            
            .axis-range-controls .range-group {
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
            }
            
            .axis-range-controls input[type="number"] {
                width: 100%;
            }
            
            .axis-range-controls button {
                width: 100%;
            }
            
            .coordinates-table {
                margin-top: 60px;
            }
            
            .coordinate-pair {
                font-size: 12px;
                padding: 6px 10px;
            }
        }
        
        @media screen and (max-width: 480px) {
            .graph-container {
                padding: 10px;
                margin: 20px auto;
            }
            
            .graph-card {
                padding: 15px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .graph-card h3 {
                font-size: 16px;
            }
            
            .coordinates-table {
                margin-top: 40px;
            }
            
            .coordinates-display {
                gap: 8px;
            }
            
            .coordinate-pair {
                font-size: 11px;
                padding: 5px 8px;
            }
        }
    </style>
</head>

            <p style="color: #ccc; margin-top: 0; font-size: 13px;">Enter an equation like <code style="background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 3px;">y=2x-1</code>, <code style="background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 3px;">-y=x+3</code>, or <code style="background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 3px;">-3y=2x-1</code></p>
            <div class="equation-input-group">

                    type="text"

    <script src="/script.js"></script>
    <script>
        // Global chart references
        let equationChartInstance = null;

        // Helper function to evaluate mathematical expressions with division and multiplication
        function evaluateExpression(expr) {
            if (!expr) return NaN;
            
            try {
                // Handle division: split by / and multiply/divide
                const parts = expr.split('/');
                let result = parseFloat(parts[0]);
                
                if (isNaN(result)) return NaN;
                
                for (let i = 1; i < parts.length; i++) {
                    const divisor = parseFloat(parts[i]);
                    if (isNaN(divisor) || divisor === 0) return NaN;
                    result /= divisor;
                }
                
                return result;
            } catch (e) {
                return NaN;
            }
        }

        // Linear Equation Validator

        function validateEquation() {
            const input = document.getElementById('equationInput').value.trim();
            const resultDiv = document.getElementById('validationResult');
            const infoDiv = document.getElementById('equationInfo');
            const chartWrapper = document.getElementById('equationChartWrapper');

            // Reset messages
            resultDiv.className = 'validation-result';
            infoDiv.className = 'equation-info';
            chartWrapper.style.display = 'none';

            if (!input) {
                resultDiv.textContent = '⚠️ Please enter an equation';
                resultDiv.classList.add('invalid');
                return;
            }

            const result = parseLinearEquation(input);
            
            if (result.valid) {
                // Format slope and intercept as fractions
                const slopeDisplay = formatAsFraction(result.slope);
                const interceptDisplay = formatAsFraction(result.intercept);
                
                resultDiv.textContent = `✅ Valid Linear Equation! (y = ${slopeDisplay}x + ${interceptDisplay})`;
                resultDiv.classList.add('valid');
                
                infoDiv.classList.add('show');
                let infoHTML = '';
                
                // Show conversion steps if equation was converted
                if (result.converted && result.conversionSteps && result.conversionSteps.length > 0) {
                    infoHTML += `
                        <strong>⚙️ Conversion Steps:</strong><br>
                        <div style="font-family: monospace; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; margin: 8px 0; line-height: 1.8;">
                            ${result.conversionSteps.map((step, index) => `${index + 1}. ${step}`).join('<br>')}
                        </div>
                    `;
                }
                
                // Build the equation form display
                let equationForm = 'y = ';
                if (result.slope === 0) {
                    equationForm += interceptDisplay;
                } else {
                    equationForm += slopeDisplay + 'x';
                    if (result.intercept !== 0) {
                        equationForm += result.intercept >= 0 ? ' + ' + interceptDisplay : ' - ' + formatAsFraction(Math.abs(result.intercept));
                    }
                }
                
                // Show both fraction and decimal
                const slopeDecimal = result.slope.toFixed(4);
                const interceptDecimal = result.intercept.toFixed(4);
                
                infoHTML += `
                    <strong>Equation Details:</strong><br>
                    Slope (m): <strong>${slopeDisplay}</strong> ${slopeDisplay !== slopeDecimal ? `<span style="color: #aaa;">(≈ ${slopeDecimal})</span>` : ''}<br>
                    Y-intercept (b): <strong>${interceptDisplay}</strong> ${interceptDisplay !== interceptDecimal ? `<span style="color: #aaa;">(≈ ${interceptDecimal})</span>` : ''}<br>
                    Form: <strong>${equationForm}</strong>
                `;
                
                infoDiv.innerHTML = infoHTML;

                // Plot the equation
                plotEquation(result.slope, result.intercept);
            } else {
                resultDiv.textContent = `❌ ${result.error}`;
                resultDiv.classList.add('invalid');
            }
        }

        // Helper function to negate a term
        function negateTerm(term, isFirst) {
            // Remove leading + or -
            let sign = '';
            let value = term;
            
            if (term.startsWith('+')) {
                sign = '-';
                value = term.substring(1);
            } else if (term.startsWith('-')) {
                sign = '+';
                value = term.substring(1);
            } else {
                // No explicit sign means positive
                sign = '-';
                value = term;
            }
            
            // For the first term, don't add + sign
            if (isFirst && sign === '+') {
                return value;
            }
            
            return sign + value;
        }

        // Helper function to negate an expression
        function negateExpression(expr) {
            // This function negates each term in the expression
            // For example: "x-10" becomes "-x+10", "2x+5" becomes "-2x-5"
            
            let result = '';
            let currentTerm = '';
            let lastWasOperator = true;
            
            for (let i = 0; i < expr.length; i++) {
                const char = expr[i];
                
                if ((char === '+' || char === '-') && !lastWasOperator && currentTerm.length > 0) {
                    // We've hit a new term, process the previous one
                    result += negateTerm(currentTerm, result.length === 0);
                    currentTerm = char;
                    lastWasOperator = true;
                } else {
                    currentTerm += char;
                    lastWasOperator = false;
                }
            }
            
            // Process the last term
            if (currentTerm.length > 0) {
                result += negateTerm(currentTerm, result.length === 0);
            }
            
            return result;
        }

        // Helper function to divide an expression by a coefficient
        function divideExpression(expr, divisor) {
            // Parse the expression to extract slope and intercept terms
            // Then divide each by the divisor
            
            // This is a simplified approach - parse as linear equation
            let slope = 0;
            let intercept = 0;
            
            // Replace * with empty
            expr = expr.replace(/\*/g, '');
            
            if (expr.includes('x')) {
                const xParts = expr.split('x');
                const beforeX = xParts[0];
                const afterX = xParts[1];
                
                // Parse slope
                if (beforeX === '' || beforeX === '+') {
                    slope = 1;
                } else if (beforeX === '-') {
                    slope = -1;
                } else {
                    slope = evaluateExpression(beforeX);
                }
                
                // Parse intercept
                if (afterX === '') {
                    intercept = 0;
                } else {
                    intercept = evaluateExpression(afterX);
                }
            } else {
                // No x, just a constant
                intercept = evaluateExpression(expr);
                slope = 0;
            }
            
            // Divide both by the divisor
            slope = slope / divisor;
            intercept = intercept / divisor;
            
            // Reconstruct as expression
            let result = '';
            
            // Format slope
            if (slope === 1) {
                result = 'x';
            } else if (slope === -1) {
                result = '-x';
            } else if (slope !== 0) {
                // Keep as fraction if it simplifies nicely
                const slopeStr = formatAsFraction(slope);
                result = slopeStr + 'x';
            }
            
            // Format intercept
            if (intercept !== 0) {
                if (intercept > 0) {
                    result += '+' + formatAsFraction(intercept);
                } else {
                    result += formatAsFraction(intercept);
                }
            } else if (slope === 0) {
                result = '0';
            }
            
            return result;
        }
        
        // Helper function to format a number as a fraction if appropriate
        function formatAsFraction(num) {
            // Check if it's already an integer
            if (Number.isInteger(num)) {
                return num.toString();
            }
            
            // For common fractions, display as fraction
            const tolerance = 0.0001;
            for (let denominator = 2; denominator <= 12; denominator++) {
                for (let numerator = -12 * denominator; numerator <= 12 * denominator; numerator++) {
                    if (Math.abs(num - numerator/denominator) < tolerance) {
                        if (numerator === denominator) return '1';
                        if (numerator === -denominator) return '-1';
                        return numerator + '/' + denominator;
                    }
                }
            }
            
            // Otherwise return decimal rounded to 4 places
            return (Math.round(num * 10000) / 10000).toString();
        }

        function parseLinearEquation(equation) {
            // Remove spaces
            equation = equation.replace(/\s+/g, '');
            
            // Track if conversion happened
            let converted = false;
            let originalEquation = equation;
            let originalRight = '';
            let convertedEquation = '';
            let conversionSteps = [];
            
            // Check if equation contains '='
            if (!equation.includes('=')) {
                return { valid: false, error: 'Equation must contain "="', converted: false };
            }
            
            // Split by '='
            let parts = equation.split('=');
            if (parts.length !== 2) {
                return { valid: false, error: 'Invalid equation format', converted: false };
            }
            
            let leftSide = parts[0];
            let rightSide = parts[1];
            
            // Check if x is on the left side (e.g., 7x=y-5)
            if (leftSide.includes('x') && !leftSide.includes('y')) {
                converted = true;
                conversionSteps.push(`Original: <strong>${originalEquation}</strong>`);
                
                // Parse the left side to extract coefficient of x
                let xCoefficient = 1;
                if (leftSide === 'x') {
                    xCoefficient = 1;
                } else if (leftSide === '-x') {
                    xCoefficient = -1;
                } else if (leftSide.endsWith('x')) {
                    const coeffPart = leftSide.substring(0, leftSide.length - 1);
                    xCoefficient = evaluateExpression(coeffPart);
                    if (isNaN(xCoefficient)) {
                        return { valid: false, error: 'Invalid coefficient for x', converted: false };
                    }
                }
                
                // Parse right side: should be y ± constant
                // e.g., y-5, y+3, -y+2, etc.
                let yPart = '';
                let constantPart = '';
                
                // Find where y is
                const yIndex = rightSide.indexOf('y');
                if (yIndex === -1) {
                    return { valid: false, error: 'Right side must contain y', converted: false };
                }
                
                // Check if there's a coefficient before y
                let yCoeffOnRight = 1;
                if (yIndex > 0) {
                    const beforeY = rightSide.substring(0, yIndex);
                    if (beforeY === '-') {
                        yCoeffOnRight = -1;
                    } else if (beforeY !== '' && beforeY !== '+') {
                        // There's a coefficient
                        yCoeffOnRight = evaluateExpression(beforeY);
                    }
                }
                
                // Get the part after y
                const afterY = rightSide.substring(yIndex + 1);
                
                // Rearrange: xCoeff*x = yCoeff*y + constant
                // Becomes: yCoeff*y = xCoeff*x - constant
                // Then: y = (xCoeff*x - constant) / yCoeff
                
                // Build the right side after rearrangement: xCoeff*x - constant
                let newConstant = 0;
                if (afterY !== '') {
                    // Parse the constant
                    const constantValue = evaluateExpression(afterY);
                    newConstant = -constantValue; // Flip sign when moving to other side
                }
                
                // Build right side expression: xCoeff*x + newConstant
                let xPart = xCoefficient === 1 ? 'x' : (xCoefficient === -1 ? '-x' : xCoefficient + '*x');
                let constantStr = '';
                if (newConstant > 0) {
                    constantStr = '+' + newConstant;
                } else if (newConstant < 0) {
                    constantStr = newConstant.toString();
                }
                
                const rearrangedRight = xPart + constantStr;
                
                // Now we have: yCoeff*y = rearrangedRight
                conversionSteps.push(`Rearrange to isolate y terms: <strong>${yCoeffOnRight === 1 ? 'y' : (yCoeffOnRight === -1 ? '-y' : yCoeffOnRight + 'y')} = ${rearrangedRight}</strong>`);
                
                // If yCoeff is not 1, divide both sides
                if (yCoeffOnRight !== 1) {
                    conversionSteps.push(`Divide both sides by ${yCoeffOnRight}:`);
                    conversionSteps.push(`&nbsp;&nbsp;&nbsp;<strong>y = (${rearrangedRight}) ÷ ${yCoeffOnRight}</strong>`);
                    
                    // Use divideExpression to handle the division
                    const dividedRight = divideExpression(rearrangedRight, yCoeffOnRight);
                    equation = 'y=' + dividedRight;
                    conversionSteps.push(`Simplified: <strong>${equation}</strong>`);
                } else {
                    equation = 'y=' + rearrangedRight;
                    conversionSteps.push(`Simplified: <strong>${equation}</strong>`);
                }
                
                convertedEquation = equation;
                originalRight = rightSide;
                
                // Re-split for continued processing
                parts = equation.split('=');
                leftSide = parts[0];
                rightSide = parts[1];
            }
            
            // Parse the left side to extract coefficient of y
            // Valid forms: y, -y, 2y, -3y, etc.
            let yCoefficient = 1;
            
            if (leftSide === 'y') {
                yCoefficient = 1;
            } else if (leftSide === '-y') {
                yCoefficient = -1;
            } else if (leftSide.endsWith('y')) {
                // Extract the coefficient part
                const coeffPart = leftSide.substring(0, leftSide.length - 1);
                yCoefficient = evaluateExpression(coeffPart);
                
                if (isNaN(yCoefficient)) {
                    return { valid: false, error: 'Invalid coefficient for y', converted: false };
                }
            } else {
                return { valid: false, error: 'Left side must be in the form of "ay" where a is a number', converted: false };
            }
            
            // If coefficient is not 1, we need to divide both sides
            if (yCoefficient !== 1) {
                converted = true;
                originalRight = rightSide;
                conversionSteps.push(`Original: <strong>${originalEquation}</strong>`);
                conversionSteps.push(`Divide both sides by ${yCoefficient}:`);
                conversionSteps.push(`&nbsp;&nbsp;&nbsp;<strong>y = (${rightSide}) ÷ ${yCoefficient}</strong>`);
                
                // Divide the right side by the coefficient
                rightSide = divideExpression(rightSide, yCoefficient);
                
                equation = 'y=' + rightSide;
                convertedEquation = equation;
                conversionSteps.push(`Simplified: <strong>${equation}</strong>`);
            }
            
            // Now continue with standard parsing
            parts = equation.split('=');
            leftSide = parts[0];
            
            if (leftSide !== 'y') {
                return { valid: false, error: 'After conversion, left side must be "y"', converted: false };
            }

            rightSide = parts[1];

            // Parse the right side to extract slope and intercept
            // Valid linear forms: mx+b, mx-b, m*x+b, m*x-b, x+b, x-b, mx, x, b
            
            try {
                // Replace * with empty (handle cases like 2*x)
                let expr = rightSide.replace(/\*/g, '');
                
                // Initialize slope and intercept
                let slope = 0;
                let intercept = 0;
                let foundX = false;

                // Check if x exists
                if (expr.includes('x')) {
                    foundX = true;
                    // Split by x
                    const xParts = expr.split('x');
                    const beforeX = xParts[0];
                    const afterX = xParts[1];

                    // Parse slope (before x)
                    if (beforeX === '' || beforeX === '+') {
                        slope = 1;
                    } else if (beforeX === '-') {
                        slope = -1;
                    } else {
                        slope = evaluateExpression(beforeX);
                        if (isNaN(slope)) {
                            return { valid: false, error: 'Invalid coefficient for x (e.g., use 1/2 for fractions)' };
                        }
                    }

                    // Parse intercept (after x)
                    if (afterX === '') {
                        intercept = 0;
                    } else {
                        intercept = evaluateExpression(afterX);
                        if (isNaN(intercept)) {
                            return { valid: false, error: 'Invalid intercept value' };
                        }
                    }
                } else {
                    // No x, must be just a constant (valid linear with slope 0)
                    intercept = evaluateExpression(expr);
                    if (isNaN(intercept)) {
                        return { valid: false, error: 'Invalid constant value' };
                    }
                    slope = 0;
                }

                // Round to reasonable precision
                slope = Math.round(slope * 10000) / 10000;
                intercept = Math.round(intercept * 10000) / 10000;

                return { 
                    valid: true, 
                    slope, 
                    intercept,
                    converted,
                    originalEquation,
                    originalRight,
                    convertedEquation,
                    conversionSteps
                };
            } catch (e) {
                return { valid: false, error: 'Could not parse equation', converted: false };
            }
        }

        // Global state for equation
        let currentEquation = { slope: 0, intercept: 0, samplePoints: [] };

        function resetGraphRange() {
            document.getElementById('xMin').value = -10;
            document.getElementById('xMax').value = 10;
            document.getElementById('yMin').value = -20;
            document.getElementById('yMax').value = 20;
            updateGraphRange();
        }

        function updateGraphRange() {
            if (currentEquation.slope !== undefined) {
                plotEquation(currentEquation.slope, currentEquation.intercept);
            }
        }

        function updateCoordinateDisplay() {
            const showWorking = document.getElementById('showWorkingCheckbox').checked;
            const coordinatesDisplay = document.getElementById('coordinatesDisplay');
            const { slope, intercept, samplePoints } = currentEquation;

            if (showWorking) {
                // Show working with calculation steps
                coordinatesDisplay.innerHTML = samplePoints.map(point => {
                    const calculation = slope * point.x + intercept;
                    const slopeStr = slope >= 0 ? slope : `(${slope})`;
                    const interceptStr = intercept >= 0 ? `+ ${intercept}` : `- ${Math.abs(intercept)}`;
                    
                    return `
                        <div class="coordinate-pair with-working">
                            <div><strong>x=${point.x}:</strong></div>
                            <div class="working-steps">y = ${slopeStr}(${point.x}) ${interceptStr}</div>
                            <div class="working-steps">y = ${Math.round(slope * point.x * 100) / 100} ${interceptStr}</div>
                            <div class="working-steps">y = ${point.y}</div>
                        </div>
                    `;
                }).join('');
            } else {
                // Show simple coordinate pairs
                coordinatesDisplay.innerHTML = samplePoints.map(point => `
                    <div class="coordinate-pair">
                        <strong>x:</strong>${point.x} <strong>y:</strong>${point.y}
                    </div>
                `).join('');
            }
        }

        function plotEquation(slope, intercept) {
            const chartWrapper = document.getElementById('equationChartWrapper');
            const coordinatesTable = document.getElementById('coordinatesTable');
            const coordinatesDisplay = document.getElementById('coordinatesDisplay');
            const canvas = document.getElementById('equationChart');

            // Calculate 10 sample coordinates for validation
            const samplePoints = [];
            for (let i = 0; i < 10; i++) {
                const x = -5 + i;
                const y = slope * x + intercept;
                samplePoints.push({
                    x: Math.round(x * 100) / 100,
                    y: Math.round(y * 100) / 100
                });
            }

            // Store current equation data globally
            currentEquation = { slope, intercept, samplePoints };

            // Populate coordinates display
            updateCoordinateDisplay();

            // Get custom axis ranges
            const xMin = parseFloat(document.getElementById('xMin').value) || -10;
            const xMax = parseFloat(document.getElementById('xMax').value) || 10;
            const yMin = parseFloat(document.getElementById('yMin').value) || -20;
            const yMax = parseFloat(document.getElementById('yMax').value) || 20;

            // Calculate points for the line chart (use small step for smooth line)
            const points = [];
            const dataStep = (xMax - xMin) / 100; // More points for smoother line
            
            for (let x = xMin; x <= xMax; x += dataStep) {
                const y = slope * x + intercept;
                points.push({ x: x, y: y });
            }

            if (equationChartInstance) {
                equationChartInstance.destroy();
            }

            const ctx = canvas.getContext('2d');
            
            // Custom plugin to draw axes
            const axesPlugin = {
                id: 'axesPlugin',
                afterDatasetsDraw(chart) {
                    const ctx = chart.ctx;
                    const xScale = chart.scales.x;
                    const yScale = chart.scales.y;
                    const chartArea = chart.chartArea;
                    
                    // Get pixel positions for x=0 and y=0 using linear scale
                    const x0Pixel = xScale.getPixelForValue(0);
                    const y0Pixel = yScale.getPixelForValue(0);
                    
                    // Draw y-axis (vertical line at x = 0) if 0 is in range
                    if (x0Pixel >= chartArea.left && x0Pixel <= chartArea.right) {
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(x0Pixel, chartArea.top);
                        ctx.lineTo(x0Pixel, chartArea.bottom);
                        ctx.stroke();
                    }
                    
                    // Draw x-axis (horizontal line at y = 0) if 0 is in range
                    if (y0Pixel >= chartArea.top && y0Pixel <= chartArea.bottom) {
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(chartArea.left, y0Pixel);
                        ctx.lineTo(chartArea.right, y0Pixel);
                        ctx.stroke();
                    }
                    
                    // Mark the origin (if both axes are visible)
                    if (x0Pixel >= chartArea.left && x0Pixel <= chartArea.right &&
                        y0Pixel >= chartArea.top && y0Pixel <= chartArea.bottom) {
                        ctx.fillStyle = '#ffd600';
                        ctx.beginPath();
                        ctx.arc(x0Pixel, y0Pixel, 4, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                }
            };
            
            equationChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: `y = ${slope}x ${intercept >= 0 ? '+' : ''} ${intercept}`,
                        data: points,
                        borderColor: '#4facfe',
                        backgroundColor: 'rgba(79, 172, 254, 0.1)',
                        borderWidth: 3,
                        tension: 0,
                        fill: true,
                        pointBackgroundColor: '#00f2fe',
                        pointBorderColor: '#4facfe',
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: '#ffd600'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: 1,
                    plugins: {
                        legend: {
                            labels: { color: '#fff' }
                        },
                        axesPlugin: {}
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            min: yMin,
                            max: yMax,
                            ticks: { 
                                color: '#fff',
                                stepSize: 1
                            },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            type: 'linear',
                            min: xMin,
                            max: xMax,
                            ticks: { 
                                color: '#fff',
                                stepSize: 1,
                                maxTicksLimit: 20
                            },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    }
                },
                plugins: [axesPlugin]
            });

            chartWrapper.style.display = 'block';
            coordinatesTable.style.display = 'block';
        }

        // Initialize charts on page load
        window.addEventListener('DOMContentLoaded', () => {
            // Equation validator is ready
        });
    </script>
</body>
</html>

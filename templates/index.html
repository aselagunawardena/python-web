<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Text Display</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <h1>✨ Fun Text Display ✨</h1>
        
        <div class="input-section">
            <textarea id="textInput" placeholder="Type something fun here..."></textarea>
            <button onclick="displayText()">Display Text</button>
        </div>
        
        <div id="outputSection" class="output-section" style="display: none;">
            <h2>Your Text:</h2>
            <div id="displayBox" class="display-box"></div>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>

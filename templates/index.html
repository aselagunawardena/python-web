<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Text Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        
        .input-section {
            margin-bottom: 20px;
        }
        
        textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
            resize: vertical;
            min-height: 100px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .output-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        
        .display-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            min-height: 100px;
            word-wrap: break-word;
            color: #333;
            font-size: 28px;
            line-height: 1.6;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Fun Text Display ✨</h1>
        
        <form method="POST" action="/display" class="input-section">
            <textarea name="text" placeholder="Type something fun here..."></textarea>
            <button type="submit">Display Text</button>
        </form>
        
        {% if displayed_text %}
        <div class="output-section">
            <h2>Your Text:</h2>
            <div class="display-box">
                {{ displayed_text }}
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
